- insert:
    - id: kode
      name: '@kode/dsh'
      config:
        url: http://127.0.0.1:47870
        sharedBackendState: true
    - id: kode-native-factory
      name: '@kode/dsh/native-factory'
    - id: kode-workspace-storage
      name: '@kode/dsh/workspace-backend'
    - id: kode-workspace-registry
      name: '@kode/dsh/workspace-registry'
    # Both flows are required when one tab can select a local or SSH Host.
    - id: kode-directory-browse
      name: '@kode/dsh-directory-browse'
    # Loader entries are keyed by id; the appended entry replaces the base Chat
    # while preserving the namespace used by official onboarding and settings.
    - id: ui-chat
      name: '@kode/dsh-chat'
      config:
        transcriptView: standard
        collapseTiming: completion
    - id: kode-sidebar-browser
      name: '@kode/dsh-browser'
    - id: kode-connection
      name: '@kode/dsh-transport'
      inject: [webStartup]
      config:
        trustedHosts: !!js ctx.webStartup.trustedHosts
    # Ship the official dsh ACP runtime by default alongside external Agents.
    - id: kode-dsh-conversation
      name: '@kode/dsh/dsh-conversation'
- id: connection
  disabled: true
- id: workspace
  disabled: true
- id: storage-domain
  config:
    backend: json
    routes:
      workspace: kode-workspaces
# Official loops, prompts, tools, presets and defaults remain owned by dsh.
- id: ui-model-selection
  disabled: true
- id: ui-agent-preset
  disabled: true
# Keep the official sidebar chrome with a private top-level Chromium page provider.
- id: ui-sidebar-browser
  disabled: true
