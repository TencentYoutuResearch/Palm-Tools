[package]
name = "kode-memory"
version = "0.0.1"
edition = "2021"
description = "Shared memory pool for kode-managed AI agents (prototype)"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "fs", "io-std"] }
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
anyhow = "1"
thiserror = "1"
ulid = "1"
dirs = "5"
tracing = "0.1"
clap = { version = "4", features = ["derive"] }
globset = "0.4"
chrono = "0.4"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }

[[bin]]
name = "kode-memory-mcp"
path = "src/bin/mcp_server.rs"

[[bin]]
name = "kode-memory"
path = "src/bin/cli.rs"

[lib]
name = "kode_memory"
path = "src/lib.rs"
