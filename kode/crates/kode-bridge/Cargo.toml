[package]
name = "kode-bridge"
version.workspace = true
edition.workspace = true
description = "Headless kode remote bridge server without Tauri/WebKit"

[dependencies]
kode-core = { path = "../kode-core" }
kode-memory = { path = "../kode-memory" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs", "io-util", "process", "signal"] }
axum = { version = "0.7", features = ["ws", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
dirs = "5"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
portable-pty = "0.9"
chrono = { version = "0.4", default-features = false, features = ["std"] }
rusqlite = { version = "0.31", features = ["bundled"] }
fs2 = "0.4"
futures-util = "0.3"
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-native-roots"] }

[dev-dependencies]
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[[bin]]
name = "kode-bridge"
path = "src/main.rs"

[[bin]]
name = "kode-session-server"
path = "src/messaging/main.rs"

[[bin]]
name = "kode-ssh-tunnel"
path = "src/messaging/tunnel_main.rs"
