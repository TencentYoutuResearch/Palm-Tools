[workspace]
resolver = "2"
members = [
    "crates/kode-core",
    "crates/kode-tui",
    "crates/kode-memory",
    "crates/kode-bridge",
    "apps/gui/src-tauri",
]

[workspace.package]
edition = "2021"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 1
