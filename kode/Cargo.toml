[workspace]
resolver = "2"
members = [
    "crates/kode-core",
    "crates/kode-tui",
    "crates/kode-memory",
    "crates/kode-bridge",
    "crates/kode-sync-server",
    "apps/gui/src-tauri",
]
exclude = ["vendor/vt100-ctt"]

# vt100-ctt 0.17.1 leaves an orphaned wide cell when a resize truncates the
# continuation column. A subsequent ED/EL sequence then indexes past the row
# and aborts the release GUI (`panic = "abort"`). Keep the small upstream fork
# local until the fix is released by the crate.
[patch.crates-io]
vt100-ctt = { path = "vendor/vt100-ctt" }

[workspace.package]
edition = "2021"
version = "0.2.2-dev"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"

[profile.dev]
opt-level = 1
