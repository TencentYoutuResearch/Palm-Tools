name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remote-memory-bridge:
    name: Build Linux bundles (bridge & sync server)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Require updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 != '' }}
          HAS_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD != '' }}
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "::error::Set TAURI_SIGNING_PRIVATE_KEY in Actions secrets to the original key matching kode's updater public key."
            exit 1
          fi
          if [[ "$HAS_APPLE_CERTIFICATE" != "$HAS_APPLE_CERTIFICATE_PASSWORD" ]]; then
            echo "::error::Configure both APPLE_DEVELOPER_ID_P12_BASE64 and APPLE_DEVELOPER_ID_P12_PASSWORD."
            exit 1
          fi

      - name: Build musl remote memory bridge
        working-directory: kode
        run: bash deploy/build-remote-memory-bridge.sh --musl

      - name: Collect remote bridge assets
        run: |
          set -euo pipefail
          mkdir -p release-assets/remote-bridge
          cp kode/target/remote-memory-bridge/kode-remote-memory-bridge-x86_64-unknown-linux-musl.tar.gz \
            release-assets/remote-bridge/kode-remote-memory-bridge-x86_64-unknown-linux-musl.tar.gz
          cp kode/target/remote-memory-bridge/kode-remote-memory-bridge-x86_64-unknown-linux-musl.tar.gz \
            release-assets/remote-bridge/kode-remote-memory-bridge-linux-musl.tar.gz

      - name: Build musl sync server
        working-directory: kode
        run: bash deploy/build-sync-server.sh

      - name: Collect sync server assets
        run: |
          set -euo pipefail
          mkdir -p release-assets/sync-server
          cp kode/target/sync-server/kode-sync-server-x86_64-unknown-linux-musl.tar.gz \
            release-assets/sync-server/kode-sync-server-x86_64-unknown-linux-musl.tar.gz

      - uses: actions/upload-artifact@v6
        with:
          name: remote-memory-bridge
          path: release-assets/remote-bridge/*.tar.gz
          if-no-files-found: error

      - uses: actions/upload-artifact@v6
        with:
          name: sync-server
          path: release-assets/sync-server/*.tar.gz
          if-no-files-found: error

  macos-app:
    name: Build macOS app (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: remote-memory-bridge
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-15
            expected_macho: arm64
          - arch: x86_64
            runner: macos-15-intel
            expected_macho: x86_64
    env:
      APPLE_SIGNING_AVAILABLE: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 != '' && secrets.APPLE_DEVELOPER_ID_P12_PASSWORD != '' }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kode

      - uses: pnpm/action-setup@v6
        with:
          version: "11.2.2"

      - uses: actions/setup-node@v6
        with:
          node-version: "22.13"
          cache: pnpm
          cache-dependency-path: |
            kode/apps/gui/pnpm-lock.yaml
            kode/apps/specops/pnpm-lock.yaml
            kode/apps/specops/frontend/pnpm-lock.yaml

      - name: Install GUI dependencies
        run: pnpm --dir kode/apps/gui install --frozen-lockfile

      - uses: actions/download-artifact@v6
        with:
          name: remote-memory-bridge
          path: release-assets/remote-bridge

      - uses: actions/download-artifact@v6
        with:
          name: sync-server
          path: release-assets/sync-server

      - name: Install remote bridge resource
        run: |
          set -euo pipefail
          mkdir -p kode/apps/gui/src-tauri/resources
          cp release-assets/remote-bridge/kode-remote-memory-bridge-linux-musl.tar.gz \
            kode/apps/gui/src-tauri/resources/kode-remote-memory-bridge-linux-musl.tar.gz

      - name: Install sync server resource
        # run.sh app 会校验该资源;macOS runner 没有 Docker,必须预置。
        run: |
          set -euo pipefail
          mkdir -p kode/apps/gui/src-tauri/resources
          cp release-assets/sync-server/kode-sync-server-x86_64-unknown-linux-musl.tar.gz \
            kode/apps/gui/src-tauri/resources/kode-sync-server-linux-musl.tar.gz

      - name: Import Apple signing certificate
        if: env.APPLE_SIGNING_AVAILABLE == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}

      - name: Set application version from tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          VERSION="$version" python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          cargo = Path("kode/Cargo.toml")
          cargo.write_text(re.sub(
              r'(?ms)^(\[workspace\.package\]\n.*?^version = ")[^"]+(")',
              rf'\g<1>{version}\2',
              cargo.read_text(),
              count=1,
          ))
          for filename in (
              Path("kode/apps/gui/package.json"),
              Path("kode/apps/gui/src-tauri/tauri.conf.json"),
          ):
              data = json.loads(filename.read_text())
              data["version"] = version
              filename.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n")
          PY

      - name: Build macOS app
        working-directory: kode
        env:
          KODE_FORCE_DMG: "1"
          CONFIGURED_APPLE_SIGNING_IDENTITY: ${{ vars.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -n "$CONFIGURED_APPLE_SIGNING_IDENTITY" ]]; then
            export APPLE_SIGNING_IDENTITY="$CONFIGURED_APPLE_SIGNING_IDENTITY"
          fi
          # Empty notarization variables must not count as configured credentials.
          if [[ -z "$APPLE_ID" && -z "$APPLE_PASSWORD" && -z "$APPLE_TEAM_ID" ]]; then
            unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          elif [[ -z "$APPLE_ID" || -z "$APPLE_PASSWORD" || -z "$APPLE_TEAM_ID" ]]; then
            echo "::error::Configure all three notarization secrets: APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID."
            exit 1
          fi
          bash deploy/build-macos-ci.sh

      - name: Verify complete app signature
        run: |
          codesign --verify --deep --strict --verbose=2 kode/target/release/bundle/macos/kode.app
          if [[ "$APPLE_SIGNING_AVAILABLE" == 'true' ]]; then
            codesign -dv --verbose=4 kode/target/release/bundle/macos/kode.app 2>&1 | grep 'Authority=Developer ID Application:'
          fi

      - name: Install updater signature verifier
        run: brew install minisign

      - name: Verify updater package against embedded public key
        working-directory: kode
        run: python3 deploy/verify-updater.py target/release/bundle/macos/kode.app.tar.gz

      - name: Verify macOS bundle architecture
        env:
          EXPECTED_MACHO: ${{ matrix.expected_macho }}
        run: |
          set -euo pipefail
          app_dir=kode/target/release/bundle/macos/kode.app/Contents/MacOS
          for binary in kode-gui kode-memory kode-memory-mcp specops; do
            actual="$(lipo -archs "$app_dir/$binary")"
            if [[ "$actual" != "$EXPECTED_MACHO" ]]; then
              echo "error: $binary has architecture '$actual', expected '$EXPECTED_MACHO'" >&2
              exit 1
            fi
          done

      - name: Collect macOS assets
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          RELEASE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p release-assets/macos
          shopt -s nullglob
          dmg_files=(kode/target/release/bundle/dmg/*.dmg)
          if (( ${#dmg_files[@]} > 0 )); then
            cp "${dmg_files[@]}" release-assets/macos/
          else
            ditto -c -k --sequesterRsrc --keepParent \
              kode/target/release/bundle/macos/kode.app \
              "release-assets/macos/kode-${GITHUB_REF_NAME:-dev}-macos-${RUNNER_ARCH}.app.zip"
          fi
          version="${RELEASE_VERSION#v}"
          updater_base="kode_${version}_${RELEASE_ARCH}.app.tar.gz"
          cp kode/target/release/bundle/macos/kode.app.tar.gz \
            "release-assets/macos/$updater_base"
          cp kode/target/release/bundle/macos/kode.app.tar.gz.sig \
            "release-assets/macos/$updater_base.sig"

      - uses: actions/upload-artifact@v6
        with:
          name: macos-app-${{ matrix.arch }}
          path: release-assets/macos/*
          if-no-files-found: error

  windows-app:
    name: Build Windows app
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.89'
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kode
      - uses: pnpm/action-setup@v6
        with:
          version: '11.2.2'
      - uses: actions/setup-node@v6
        with:
          node-version: '22.13'
          cache: pnpm
          cache-dependency-path: |
            kode/apps/gui/pnpm-lock.yaml
            kode/apps/specops/pnpm-lock.yaml
            kode/apps/specops/frontend/pnpm-lock.yaml
      - name: Install GUI dependencies
        run: pnpm install --frozen-lockfile
        working-directory: kode/apps/gui
      - name: Set application version from tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_VERSION.TrimStart('v')
          $cargo = Join-Path $pwd 'kode/Cargo.toml'
          $text = Get-Content -Raw $cargo
          $text = [regex]::Replace($text, '(?ms)(\[workspace\.package\]\s.*?^version = ")[^"]+(")', "`$1$version`$2", 1)
          Set-Content -Path $cargo -Value $text -NoNewline
          foreach ($file in @('kode/apps/gui/package.json', 'kode/apps/gui/src-tauri/tauri.conf.json')) {
            $json = Get-Content -Raw $file | ConvertFrom-Json
            $json.version = $version
            $json | ConvertTo-Json -Depth 20 | Set-Content -Path $file
          }
      - name: Build Windows bundle
        working-directory: kode/apps/gui
        run: pnpm tauri build --bundles nsis
      - name: Collect Windows assets
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_VERSION.TrimStart('v')
          $out = 'release-assets/windows'
          New-Item -ItemType Directory -Force $out | Out-Null
          Copy-Item "kode/target/release/bundle/nsis/kode_${version}_x64-setup.exe" $out
          $zip = "kode/target/release/bundle/nsis/kode_${version}_x64-setup.nsis.zip"
          $sig = "$zip.sig"
          if (Test-Path $zip) { Copy-Item $zip $out }
          if (Test-Path $sig) { Copy-Item $sig $out }
      - uses: actions/upload-artifact@v6
        with:
          name: windows-app
          path: release-assets/windows/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs:
      - remote-memory-bridge
      - macos-app
      - windows-app

    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: macos-app-*
          path: release-assets/macos
          merge-multiple: true

      - uses: actions/download-artifact@v6
        with:
          name: remote-memory-bridge
          path: release-assets/remote-bridge

      - uses: actions/download-artifact@v6
        with:
          name: sync-server
          path: release-assets/sync-server

      - uses: actions/download-artifact@v6
        with:
          name: windows-app
          path: release-assets/windows

      - name: Generate updater manifest
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${RELEASE_VERSION#v}"
          base="https://github.com/$REPOSITORY/releases/download/$RELEASE_VERSION"
          arm_asset="kode_${version}_aarch64.app.tar.gz"
          intel_asset="kode_${version}_x86_64.app.tar.gz"
          jq -n \
            --arg version "$version" \
            --arg arm_url "$base/$arm_asset" \
            --rawfile arm_sig "release-assets/macos/$arm_asset.sig" \
            --arg intel_url "$base/$intel_asset" \
            --rawfile intel_sig "release-assets/macos/$intel_asset.sig" \
            --rawfile win_sig "release-assets/windows/kode_${version}_x64-setup.nsis.zip.sig" \
            '{
              version: $version,
              platforms: {
                "darwin-aarch64": { url: $arm_url, signature: ($arm_sig | rtrimstr("\n")) },
                "darwin-x86_64": { url: $intel_url, signature: ($intel_sig | rtrimstr("\n")) },
                "windows-x86_64": { url: ($base + "/kode_" + $version + "_x64-setup.nsis.zip"), signature: ($win_sig | rtrimstr("\n")) }
              }
            }' > release-assets/macos/latest.json

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          files: |
            release-assets/macos/*
            release-assets/windows/*
            release-assets/remote-bridge/kode-remote-memory-bridge-x86_64-unknown-linux-musl.tar.gz
            release-assets/sync-server/kode-sync-server-x86_64-unknown-linux-musl.tar.gz
          fail_on_unmatched_files: true
