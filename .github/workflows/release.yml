name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  remote-memory-bridge:
    name: Build remote memory bridge
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build musl remote memory bridge
        working-directory: kode
        run: bash deploy/build-remote-memory-bridge.sh --musl

      - name: Collect remote bridge assets
        run: |
          set -euo pipefail
          mkdir -p release-assets/remote-bridge
          cp kode/target/remote-memory-bridge/kode-remote-memory-bridge-x86_64-unknown-linux-musl.tar.gz \
            release-assets/remote-bridge/kode-remote-memory-bridge-x86_64-unknown-linux-musl.tar.gz
          cp kode/target/remote-memory-bridge/kode-remote-memory-bridge-x86_64-unknown-linux-musl.tar.gz \
            release-assets/remote-bridge/kode-remote-memory-bridge-linux-musl.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: remote-memory-bridge
          path: release-assets/remote-bridge/*.tar.gz
          if-no-files-found: error

  macos-app:
    name: Build macOS app (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: remote-memory-bridge
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-15
            expected_macho: arm64
          - arch: x86_64
            runner: macos-15-intel
            expected_macho: x86_64
    env:
      APPLE_SIGNING_AVAILABLE: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 != '' && secrets.APPLE_DEVELOPER_ID_P12_PASSWORD != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kode

      - uses: pnpm/action-setup@v4
        with:
          version: "11.2.2"

      - uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: pnpm
          cache-dependency-path: |
            kode/apps/gui/pnpm-lock.yaml
            kode/apps/specops/pnpm-lock.yaml
            kode/apps/specops/frontend/pnpm-lock.yaml

      - name: Install GUI dependencies
        run: pnpm --dir kode/apps/gui install --frozen-lockfile

      - uses: actions/download-artifact@v4
        with:
          name: remote-memory-bridge
          path: release-assets/remote-bridge

      - name: Install remote bridge resource
        run: |
          set -euo pipefail
          mkdir -p kode/apps/gui/src-tauri/resources
          cp release-assets/remote-bridge/kode-remote-memory-bridge-linux-musl.tar.gz \
            kode/apps/gui/src-tauri/resources/kode-remote-memory-bridge-linux-musl.tar.gz

      - name: Import Apple signing certificate
        if: env.APPLE_SIGNING_AVAILABLE == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}

      - name: Build macOS app
        working-directory: kode
        run: ./run.sh app

      - name: Verify macOS bundle architecture
        env:
          EXPECTED_MACHO: ${{ matrix.expected_macho }}
        run: |
          set -euo pipefail
          app_dir=kode/target/release/bundle/macos/kode.app/Contents/MacOS
          for binary in kode-gui kode-memory kode-memory-mcp specops; do
            actual="$(lipo -archs "$app_dir/$binary")"
            if [[ "$actual" != "$EXPECTED_MACHO" ]]; then
              echo "error: $binary has architecture '$actual', expected '$EXPECTED_MACHO'" >&2
              exit 1
            fi
          done

      - name: Collect macOS assets
        run: |
          set -euo pipefail
          mkdir -p release-assets/macos
          shopt -s nullglob
          dmg_files=(kode/target/release/bundle/dmg/*.dmg)
          if (( ${#dmg_files[@]} > 0 )); then
            cp "${dmg_files[@]}" release-assets/macos/
          else
            ditto -c -k --sequesterRsrc --keepParent \
              kode/target/release/bundle/macos/kode.app \
              "release-assets/macos/kode-${GITHUB_REF_NAME:-dev}-macos-${RUNNER_ARCH}.app.zip"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: macos-app-${{ matrix.arch }}
          path: release-assets/macos/*
          if-no-files-found: error

  publish-release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs:
      - remote-memory-bridge
      - macos-app

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-app-*
          path: release-assets/macos
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          name: remote-memory-bridge
          path: release-assets/remote-bridge

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/macos/*
            release-assets/remote-bridge/kode-remote-memory-bridge-x86_64-unknown-linux-musl.tar.gz
          fail_on_unmatched_files: true
