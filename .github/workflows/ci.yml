name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust:
    runs-on: macos-15
    defaults:
      run:
        working-directory: kode
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.89'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.2.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: pnpm
          cache-dependency-path: |
            kode/apps/gui/pnpm-lock.yaml
            kode/apps/specops/pnpm-lock.yaml
            kode/apps/specops/frontend/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kode
      - name: Ensure optional remote bridge resource exists
        run: |
          set -euo pipefail
          res_dir="${GITHUB_WORKSPACE}/kode/apps/gui/src-tauri/resources"
          res_file="$res_dir/kode-remote-memory-bridge-linux-musl.tar.gz"
          mkdir -p "$res_dir"
          if [ ! -f "$res_file" ]; then
            echo "remote bridge tarball missing; creating empty placeholder for CI compile checks"
            tmp_dir="$(mktemp -d)"
            tar -C "$tmp_dir" -czf "$res_file" .
            rm -rf "$tmp_dir"
          fi
      - name: Build Tauri sidecar binaries
        run: bash "${GITHUB_WORKSPACE}/kode/apps/gui/build-sidecar.sh"
      - name: Build GUI frontend
        run: pnpm install --frozen-lockfile && pnpm build
        working-directory: kode/apps/gui
      - run: cargo test -- --test-threads=1

  specops:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: '11.2.2'
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          cache: pnpm
          cache-dependency-path: |
            kode/apps/specops/pnpm-lock.yaml
            kode/apps/specops/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: kode/apps/specops
      - run: pnpm -C frontend install --frozen-lockfile
        working-directory: kode/apps/specops
      - run: pnpm check
        working-directory: kode/apps/specops
      - run: pnpm test
        working-directory: kode/apps/specops
      - run: pnpm build
        working-directory: kode/apps/specops
      - if: github.event_name == 'pull_request'
        run: node kode/apps/specops/dist/cli/main.js gate --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}" --verify specops
