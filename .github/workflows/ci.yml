name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, feat/windows]

jobs:
  rust:
    runs-on: macos-15
    defaults:
      run:
        working-directory: kode
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.89'
      - uses: pnpm/action-setup@v6
        with:
          version: '11.2.2'
      - uses: actions/setup-node@v6
        with:
          node-version: '22.13'
          cache: pnpm
          cache-dependency-path: |
            kode/apps/gui/pnpm-lock.yaml
            kode/apps/specops/pnpm-lock.yaml
            kode/apps/specops/frontend/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kode
      - name: Build Tauri sidecar binaries
        run: bash "${GITHUB_WORKSPACE}/kode/apps/gui/build-sidecar.sh"
      - name: Build GUI frontend
        run: pnpm install --frozen-lockfile && pnpm build
        working-directory: kode/apps/gui
      - name: Test terminal platform isolation
        run: pnpm test:session-input
        working-directory: kode/apps/gui
      - name: Build SpecOps node bundle
        run: pnpm install --frozen-lockfile && pnpm build
        working-directory: kode/apps/specops
      - run: cargo test -- --test-threads=1

  specops:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: '11.2.2'
      - uses: actions/setup-node@v6
        with:
          node-version: '22.13'
          cache: pnpm
          cache-dependency-path: |
            kode/apps/specops/pnpm-lock.yaml
            kode/apps/specops/frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: kode/apps/specops
      - run: pnpm -C frontend install --frozen-lockfile
        working-directory: kode/apps/specops
      - run: pnpm check
        working-directory: kode/apps/specops
      - run: pnpm test
        working-directory: kode/apps/specops
      - run: pnpm build
        working-directory: kode/apps/specops
      - if: github.event_name == 'pull_request'
        run: node kode/apps/specops/dist/cli/main.js gate --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}" --verify specops

  windows:
    name: Windows GUI build check
    runs-on: windows-latest
    defaults:
      run:
        working-directory: kode
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.89'
      - uses: pnpm/action-setup@v6
        with:
          version: '11.2.2'
      - uses: actions/setup-node@v6
        with:
          node-version: '22.13'
          cache: pnpm
          cache-dependency-path: kode/apps/gui/pnpm-lock.yaml
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kode
      - name: Install GUI dependencies
        run: pnpm install --frozen-lockfile
        working-directory: kode/apps/gui
      - name: Stage sidecar placeholders for Tauri externalBin check
        # cargo check 只需要 tauri-build 的存在性校验通过;binaries/ 不入库,
        # macOS rust job 用 build-sidecar.sh 产真件,这里用占位文件避免整条
        # cargo+bun 构建链。发布产物由 release.yml 的 windows-app 走真 sidecar。
        shell: pwsh
        working-directory: kode/apps/gui/src-tauri
        run: |
          New-Item -ItemType Directory -Force binaries | Out-Null
          foreach ($name in 'kode-memory','kode-memory-mcp','specops') {
            New-Item -ItemType File -Force "binaries/$name-x86_64-pc-windows-msvc.exe" | Out-Null
          }
      - name: Check Windows GUI backend
        run: cargo check -p kode-gui
      - name: Check GUI frontend
        run: pnpm check
        working-directory: kode/apps/gui
