[package]
name = "kode-bridge"
version = "0.2.0-dev"
edition = "2021"
description = "Headless kode remote bridge server without Tauri/WebKit"

[dependencies]
kode-core = { path = "../kode-core" }
kode-memory = { path = "../kode-memory" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs", "io-util"] }
axum = { version = "0.7", features = ["ws", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
dirs = "5"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
portable-pty = "0.9"

[[bin]]
name = "kode-bridge"
path = "src/main.rs"
