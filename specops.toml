schema_version = 1

[project]
name = "kode"
profiles = ["desktop", "tauri", "svelte", "rust"]

# SpecOps chooses agents per responsibility. Omit `model` to use the selected
# Kode backend's configured default model.
[agents.default]
backend = "codebuddy"

# clarify / intake / plan
[agents.analysis]
backend = "codebuddy"

# implement / repair / resume
[agents.implementation]
backend = "codebuddy"

# automated review
[agents.review]
backend = "codebuddy"

[agent_backends.codebuddy]
plugin = "builtin.kode"
capabilities = ["session.create", "session.resume", "session.interrupt", "conversation.ask", "conversation.plan", "events.tools", "sandbox.policy", "model.select"]

[agent_backends.codex]
plugin = "builtin.kode"
capabilities = ["session.create", "session.interrupt", "sandbox.policy", "model.select"]

[gate]
strict_wild_specs = false

[gate.suppress]
suppress_codes = ["missing_reference", "unknown_reference"]
suppress_commit_types = ["chore", "feat", "fix", "refactor", "test", "debug", "docs"]

[verify.rust]
command = ["cargo", "test", "--", "--test-threads=1"]
timeout_ms = 300000
output_limit_bytes = 1048576

[verify.specops]
command = ["pnpm", "test"]
cwd = "apps/specops"
timeout_ms = 120000
output_limit_bytes = 1048576
